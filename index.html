<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI FAQ Generator</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
 
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

/* Background */
body{

background-image:
linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
url("background_image.png");

background-size:cover;
background-position:center;
background-attachment:fixed;

min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:40px;

}


/* Main Card */

.app-container{

background:white;
width:900px;
border-radius:15px;
box-shadow:0 20px 50px rgba(0,0,0,0.3);
display:grid;
grid-template-columns: 1fr 1fr;
overflow:hidden;

}

/* Left Section */

.left-panel{

background:linear-gradient(135deg,#667eea,#764ba2);
color:white;
padding:40px;
display:flex;
flex-direction:column;
justify-content:center;

}

.left-panel h1{
font-size:34px;
margin-bottom:10px;
}

.left-panel p{
opacity:0.9;
line-height:1.6;
}

/* Right Section */

.right-panel{

padding:35px;
background:#f7f9fc;

}

.form-title{

font-size:22px;
font-weight:600;
margin-bottom:20px;
color:#333;

}
.chatbot{

margin-top:20px;
background:rgba(255,255,255,0.15);
padding:18px;
border-radius:10px;

width:100%;
max-width:420px;

}

.chat-messages{

height:260px;          /* bigger chat area */
overflow-y:auto;

background:rgba(0,0,0,0.35);
padding:12px;
border-radius:8px;
margin-bottom:10px;
font-size:14px;
line-height:1.5;

}
.chat-messages div{
margin-bottom:6px;
}
.chat-input-area{

display:flex;
align-items:center;
gap:6px;

}

.chat-input-area{

display:flex;
align-items:center;
gap:6px;

}

.chat-input-area input{

flex:1;
padding:10px;
border-radius:6px;
border:1px solid #ccc;
background:white;
color:black;
font-size:14px;
width:auto;
padding:8px 10px;
}

.upload-btn{

width:32px;
height:32px;
background:#ffb703;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-weight:bold;
font-size:18px;
color:black;

}

/* Inputs */

input, textarea, select{

width:100%;
padding:12px;
margin-bottom:12px;
border-radius:8px;
border:1px solid #ddd;
font-size:14px;
transition:0.3s;

}

input:focus, textarea:focus, select:focus{

outline:none;
border-color:#667eea;
box-shadow:0 0 5px rgba(102,126,234,0.5);

}

/* Buttons */

button{

padding:10px 14px;
border:none;
border-radius:8px;
font-size:14px;
font-weight:600;
cursor:pointer;
transition:0.3s;

}

/* Generate Button */

.generate-btn{

background:linear-gradient(135deg,#00c6ff,#0072ff);
color:white;

}

.generate-btn:hover{

transform:translateY(-2px);
box-shadow:0 10px 20px rgba(0,0,0,0.2);

}

/* Download Button */

.download-btn{

background:linear-gradient(135deg,#f7971e,#ffd200);
color:#333;

}

.download-btn:hover{

transform:translateY(-2px);
box-shadow:0 10px 20px rgba(0,0,0,0.2);

}

/* FAQ Box */

.faq{

margin-top:15px;
background:white;
border-radius:8px;
padding:15px;
border-left:5px solid #667eea;
max-height:250px;
overflow-y:auto;

}

.faq h3{
color:#333;
margin-bottom:10px;
}

.faq b{
color:#222;
}
.main-container{

display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
align-items:start;

}

.left-panel{

max-width:450px;

}

.right-panel{

max-width:450px;

}

</style>
</head>

<body>

<div class="app-container">

<div class="left-panel">

<h1>AI FAQ Generator</h1>

<p>
A smart tool for small business owners to instantly generate
professional FAQs for their customers and download them as
Excel files for documentation and website integration.
</p>
<br>
<div class="chatbot">

<h3>AI Business Assistant</h3>

<div id="chatMessages" class="chat-messages"></div>

<div class="chat-input-area">

<input type="text" id="chatInput" placeholder="Ask any question...">

<button onclick="sendMessage()">Send</button>

<button onclick="startVoice()">🎤</button>

<label class="upload-btn">
+
<input type="file" id="imageUpload" onchange="handleImage()" hidden>
</label>
</div>

</div>

</div>


<div class="right-panel">

<div class="form-title">Enter Business Details</div>

<input type="text" id="name" placeholder="Business Name">

<select id="type">
<option>Business Category</option>
<option>Bakery</option>
<option>Restaurant</option>
<option>Salon</option>
<option>Retail Shop</option>
<option>Gym</option>
<option>Other</option>
</select>

<textarea id="services" placeholder="Products / Services"></textarea>

<input type="text" id="location" placeholder="Business Location">

<input type="text" id="hours" placeholder="Working Hours (Example: 9 AM - 9 PM)">

<input type="text" id="delivery" placeholder="Delivery Available?">

<textarea id="policy" placeholder="Return / Refund Policy"></textarea>

<input type="text" id="contact" placeholder="Manager Contact">

<button class="generate-btn" onclick="generateFAQ()">Generate FAQs</button>

<div class="faq" id="faqBox"></div>

<button class="download-btn" onclick="downloadExcel()">Download FAQs (Excel)</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script>
// -------------------- OpenRouter AI Chat --------------------
const API_KEY = "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"; // your OpenRouter API key
async function sendMessage() {
    let input = document.getElementById("chatInput");
    let message = input.value;
    let chat = document.getElementById("chatMessages");

    if (message.trim() === "") return;

    chat.innerHTML += `<div><b>You:</b> ${message}</div>`;
    input.value = "";

    try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${API_KEY}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "openai/gpt-3.5-turbo",
                messages: [
                    { role: "user", content: message }
                ]
            })
        });

        const data = await response.json();

        // safely get the reply text
        let reply = data.choices[0]?.message?.content || "No response from AI.";

        // split by new lines so each line is added separately
        let lines = reply.split(/\r?\n/).filter(line => line.trim() !== "");

        for (let line of lines) {
            chat.innerHTML += `<div><b>Assistant:</b> ${line}</div>`;
        }

        chat.scrollTop = chat.scrollHeight;

    } catch (error) {
        console.error(error);
        chat.innerHTML += `<div><b>Assistant:</b> Error connecting to AI.</div>`;
    }
}

// -------------------- FAQ Generation --------------------
function generateFAQ() {
    let name = document.getElementById("name").value;
    let type = document.getElementById("type").value;
    let services = document.getElementById("services").value;
    let location = document.getElementById("location").value;
    let hours = document.getElementById("hours").value;
    let delivery = document.getElementById("delivery").value;
    let policy = document.getElementById("policy").value;
    let contact = document.getElementById("contact").value;

    let faq = `
    <h3>Generated FAQs</h3>

    <b>What services does ${name} provide?</b>
    <p>${name} offers ${services}</p>

    <b>What type of business is ${name}?</b>
    <p>${name} is a ${type} located in ${location}</p>

    <b>What are the working hours?</b>
    <p>${hours}</p>

    <b>Do you offer delivery?</b>
    <p>${delivery}</p>

    <b>What is the return policy?</b>
    <p>${policy}</p>

    <b>How can customers contact you?</b>
    <p>${contact}</p>
    `;

    document.getElementById("faqBox").innerHTML = faq;
}

// -------------------- Excel Download --------------------
function downloadExcel() {
    let name = document.getElementById("name").value;
    let services = document.getElementById("services").value;
    let location = document.getElementById("location").value;
    let hours = document.getElementById("hours").value;
    let delivery = document.getElementById("delivery").value;
    let policy = document.getElementById("policy").value;
    let contact = document.getElementById("contact").value;

    let data = [
        ["Question", "Answer"],
        [`What services does ${name} provide?`, `${services}`],
        [`Where is ${name} located?`, `${location}`],
        [`Working hours`, `${hours}`],
        [`Delivery available?`, `${delivery}`],
        [`Return policy`, `${policy}`],
        [`Contact`, `${contact}`]
    ];

    let wb = XLSX.utils.book_new();
    let ws = XLSX.utils.aoa_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, "FAQs");
    XLSX.writeFile(wb, name + "_FAQ.xlsx");
}

// -------------------- Voice Input --------------------
function startVoice() {
    const recognition = new webkitSpeechRecognition();
    recognition.onresult = function(event) {
        let voiceText = event.results[0][0].transcript;
        document.getElementById("chatInput").value = voiceText;
    };
    recognition.start();
}

// -------------------- Image Upload --------------------
function handleImage() {
    let file = document.getElementById("imageUpload").files[0];
    let chat = document.getElementById("chatMessages");

    chat.innerHTML += `<div><b>You uploaded:</b> ${file.name}</div>`;
    chat.innerHTML += `<div><b>Assistant:</b> Image received. Processing...</div>`;
}
</script>

</body>
</html>
